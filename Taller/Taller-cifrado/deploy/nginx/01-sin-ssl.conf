# ============================================================================
# ETAPA 1 de 3 - SITIO SIN CERTIFICADO SSL  (evidencia del requisito 1)
# Destino: /etc/nginx/sites-available/santafe-pineda.shop
#          enlazado desde /etc/nginx/sites-enabled/
# ============================================================================
#
# Estado de partida: el sitio responde unicamente por HTTP en el puerto 80.
# Todo el trafico -incluido el formulario de inicio de sesion- viaja en claro y
# puede leerse con tcpdump. Esta es la captura que debe aparecer como primera
# evidencia del informe.
#
# Activar con:
#   sudo cp 01-sin-ssl.conf /etc/nginx/sites-available/santafe-pineda.shop
#   sudo ln -sf /etc/nginx/sites-available/santafe-pineda.shop /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name santafe-pineda.shop www.santafe-pineda.shop _;

    access_log /var/log/nginx/santafe-pineda.access.log;
    error_log  /var/log/nginx/santafe-pineda.error.log;

    # En esta etapa NO hay redireccion a https: el objetivo es demostrar el
    # sitio desprotegido.
    location / {
        include     /etc/nginx/snippets/proxy-node.conf;
        proxy_pass  http://127.0.0.1:4000;
    }
}
