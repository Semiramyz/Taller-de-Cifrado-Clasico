# ============================================================================
# ETAPA 3 de 3 - CERTIFICADO LET'S ENCRYPT INSTALADO A MANO  (requisitos 1 a 5)
# Destino: /etc/nginx/sites-available/santafe-pineda.shop
# ============================================================================
#
# Esta es la configuracion definitiva del taller. El certificado se emitio con
# "certbot certonly --manual" (deploy/scripts/02-letsencrypt-manual.sh), es
# decir, SIN el instalador automatico --nginx: certbot solo deposita los
# archivos y es este archivo, editado a mano, el que los pone en servicio.
#
# Archivos que certbot crea y que esta configuracion referencia:
#   /etc/letsencrypt/live/santafe-pineda.shop/fullchain.pem  <- certificado + intermedia
#   /etc/letsencrypt/live/santafe-pineda.shop/privkey.pem    <- llave privada
#   /etc/letsencrypt/live/santafe-pineda.shop/chain.pem      <- solo la intermedia
#   /etc/letsencrypt/live/santafe-pineda.shop/cert.pem       <- solo el certificado del sitio
# (live/ son enlaces simbolicos hacia /etc/letsencrypt/archive/santafe-pineda.shop/)
#
# Se usa fullchain.pem y no cert.pem: sin la intermedia el navegador no puede
# construir la cadena hasta ISRG Root X1 y SSL Labs reporta
# "Chain issues: incomplete".
#
# Activar con:
#   sudo cp 03-letsencrypt.conf /etc/nginx/sites-available/santafe-pineda.shop
#   sudo nginx -t && sudo systemctl reload nginx

# --- Puerto 80: nada se sirve en claro, salvo el reto ACME -----------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name santafe-pineda.shop www.santafe-pineda.shop _;
    # default_server y el server_name "_" hacen que tambien caigan aqui las
    # peticiones dirigidas a la IP desnuda o a un nombre desconocido: asi
    # ninguna llega en claro al sitio, ni siquiera por la puerta de atras.

    # Unica excepcion a la redireccion: la carpeta del reto http-01. El
    # protocolo ACME exige que el token se lea por HTTP en el puerto 80, y por
    # ahi solo se entregan archivos de texto estaticos, nunca la aplicacion.
    # (Si se emite el certificado con el reto dns-01 este bloque puede
    # eliminarse y el puerto 80 queda dedicado por completo a redirigir.)
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type "text/plain";
        try_files    $uri =404;
    }

    # Requisito 2: cualquier otra peticion en claro se redirige a HTTPS con 301.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Puerto 443: TLS con el certificado de Let's Encrypt -------------------
server {
    # Ver la nota sobre http2 en 02-autofirmado.conf.
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name santafe-pineda.shop www.santafe-pineda.shop;

    access_log /var/log/nginx/santafe-pineda.ssl.access.log;
    error_log  /var/log/nginx/santafe-pineda.ssl.error.log;

    # --- Las tres lineas que activan el certificado a mano -----------------
    ssl_certificate         /etc/letsencrypt/live/santafe-pineda.shop/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/santafe-pineda.shop/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/santafe-pineda.shop/chain.pem;

    # Protocolos, suites, dhparam y cache de sesion: conf.d/tls-parametros.conf

    # OCSP stapling: Let's Encrypt retiro su servicio OCSP y desde 2025 sus
    # certificados ya no llevan la extension AIA con la URL del respondedor,
    # de modo que "ssl_stapling on" solo produciria un aviso en el log sin
    # efecto. La revocacion se atiende hoy por CRL y por la vida corta (90 dias)
    # del certificado. Se deja documentado y desactivado a proposito.
    #   ssl_stapling on;
    #   ssl_stapling_verify on;

    # --- Requisito 2: HSTS ------------------------------------------------
    # Tras la primera visita el navegador se niega a hablar en claro con este
    # dominio durante dos anios, sin esperar siquiera la redireccion 301.
    # Se activa solo ahora, porque el certificado ya es de confianza publica.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # X-Content-Type-Options, X-Frame-Options y Referrer-Policy las emite la
    # propia aplicacion (src/backend/middlewares/https.ts). No se repiten aqui:
    # add_header las anadiria una segunda vez a la misma respuesta.

    location / {
        include     /etc/nginx/snippets/proxy-node.conf;
        proxy_pass  http://127.0.0.1:4000;
    }
}
