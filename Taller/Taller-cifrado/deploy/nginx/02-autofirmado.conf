# ============================================================================
# ETAPA 2 de 3 - CERTIFICADO AUTOFIRMADO  (requisito 1, segunda evidencia)
# Destino: /etc/nginx/sites-available/santafe-pineda.shop
# ============================================================================
#
# El certificado y la llave los genera deploy/scripts/01-certificado-autofirmado.sh
# y quedan en las rutas que Debian y Ubuntu reservan para ello:
#     /etc/ssl/certs/santafe-pineda.shop.crt    (certificado publico)
#     /etc/ssl/private/santafe-pineda.shop.key  (llave privada, modo 640 root:ssl-cert)
#
# Problematica asociada que debe quedar documentada en el informe: el emisor es
# el propio servidor, ninguna Autoridad Certificadora respalda la identidad, y
# por eso Firefox muestra SEC_ERROR_UNKNOWN_ISSUER y SSL Labs califica con T
# (trust failure) aunque el cifrado del canal sea correcto.
#
# Activar con:
#   sudo cp 02-autofirmado.conf /etc/nginx/sites-available/santafe-pineda.shop
#   sudo nginx -t && sudo systemctl reload nginx

# --- Puerto 80: redireccion permanente a HTTPS (requisito 2) ---------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name santafe-pineda.shop www.santafe-pineda.shop _;

    # Carpeta del reto ACME: se deja disponible desde ya para que en la etapa 3
    # certbot pueda validar el dominio por http-01 sin tocar esta configuracion.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type "text/plain";
        try_files    $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Puerto 443: TLS con el certificado autofirmado ------------------------
server {
    # nginx 1.18 (Ubuntu 22.04) y 1.24 (Ubuntu 24.04) activan HTTP/2 aqui.
    # A partir de nginx 1.25 la forma moderna es una directiva aparte,
    # "http2 on;", y esta queda obsoleta aunque sigue funcionando.
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name santafe-pineda.shop www.santafe-pineda.shop;

    access_log /var/log/nginx/santafe-pineda.ssl.access.log;
    error_log  /var/log/nginx/santafe-pineda.ssl.error.log;

    # Las dos unicas lineas que cambian entre un certificado y otro.
    ssl_certificate     /etc/ssl/certs/santafe-pineda.shop.crt;
    ssl_certificate_key /etc/ssl/private/santafe-pineda.shop.key;

    # Protocolos, suites, dhparam y cache de sesion.
    include /etc/nginx/snippets/tls-parametros.conf;

    # OJO: aqui NO se activa HSTS. Un certificado autofirmado mas HSTS dejaria
    # el navegador anclado a un sitio que no puede validar, sin posibilidad de
    # aceptar la excepcion. HSTS se activa solo en la etapa 3.

    # X-Content-Type-Options, X-Frame-Options y Referrer-Policy las emite la
    # propia aplicacion (src/backend/middlewares/https.ts). No se repiten aqui:
    # add_header las anadiria una segunda vez a la misma respuesta.

    location / {
        include     /etc/nginx/snippets/proxy-node.conf;
        proxy_pass  http://127.0.0.1:4000;
    }
}
