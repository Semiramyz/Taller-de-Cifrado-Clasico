# /etc/nginx/snippets/proxy-node.conf
#
# Fragmento comun a todas las etapas del taller. Reenvia las peticiones a la
# aplicacion Angular SSR (Node/Express) que escucha en 127.0.0.1:4000.
#
# La cabecera X-Forwarded-Proto es la que permite que Express sepa si el
# visitante llego por http o por https (ver src/backend/middlewares/https.ts).

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 60s;
proxy_redirect off;
