# /etc/nginx/snippets/tls-parametros.conf
#
# Se incluye DENTRO del bloque server que escucha en el 443, no en conf.d/.
#
# Motivo: el nginx.conf que trae Ubuntu ya declara ssl_protocols y
# ssl_prefer_server_ciphers en el contexto http, y conf.d/*.conf se incluye en
# ese mismo contexto. Declararlas alli otra vez aborta el arranque con
#   "ssl_prefer_server_ciphers" directive is duplicate
# Dentro del bloque server no hay conflicto: son mas especificas y simplemente
# sobrescriben lo que venga heredado de http, que es lo que buscamos.
#
# Perfil "intermediate" de Mozilla SSL Configuration Generator.
# Es el que lleva la calificacion A/A+ en SSL Labs.

# Solo TLS 1.2 y 1.3. SSLv3, TLS 1.0 y TLS 1.1 quedan deshabilitados por estar rotos
# (POODLE, BEAST) y porque SSL Labs penaliza su presencia.
ssl_protocols TLSv1.2 TLSv1.3;

# Suites con forward secrecy (ECDHE) y cifrado autenticado (GCM / ChaCha20-Poly1305).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

# En el perfil intermediate el orden lo elige el cliente.
ssl_prefer_server_ciphers off;

# Parametros Diffie-Hellman propios (ffdhe2048). Los genera 01-certificado-autofirmado.sh.
ssl_dhparam /etc/ssl/private/dhparam.pem;

# Reanudacion de sesion sin tickets: los tickets sin rotacion rompen forward secrecy.
ssl_session_cache shared:MozSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Resolvers para OCSP stapling (Cloudflare y Google).
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
