# /etc/nginx/conf.d/tls-parametros.conf
#
# Contexto http: estos parametros los heredan todos los bloques server, de modo
# que valen tanto para el certificado autofirmado como para el de Let's Encrypt.
# En Ubuntu, nginx.conf incluye /etc/nginx/conf.d/*.conf dentro del bloque http,
# antes de sites-enabled, asi que basta con dejar el archivo aqui.
#
# Perfil "intermediate" de Mozilla SSL Configuration Generator.
# Es el que lleva la calificacion A/A+ en SSL Labs.

# Solo TLS 1.2 y 1.3. SSLv3, TLS 1.0 y TLS 1.1 quedan deshabilitados por estar rotos
# (POODLE, BEAST) y porque SSL Labs penaliza su presencia.
ssl_protocols TLSv1.2 TLSv1.3;

# Suites con forward secrecy (ECDHE) y cifrado autenticado (GCM / ChaCha20-Poly1305).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

# En el perfil intermediate el orden lo elige el cliente.
ssl_prefer_server_ciphers off;

# Parametros Diffie-Hellman propios (ffdhe2048). Los genera 01-certificado-autofirmado.sh.
ssl_dhparam /etc/ssl/private/dhparam.pem;

# Reanudacion de sesion sin tickets: los tickets sin rotacion rompen forward secrecy.
ssl_session_cache shared:MozSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Resolvers para OCSP stapling (Cloudflare y Google).
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
